services:

  # Aplicação Spring Boot responsável pela logística.
  logistica-service:
    build:
      context: .
      dockerfile: Dockerfile

    image: logistica-service:local
    container_name: logistica-service-app

    environment:

      # A aplicação encontra seu banco pelo nome do serviço Docker.
      DB_URL: jdbc:postgresql://logistica-postgres:5432/logisticadb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      SERVER_PORT: 8084

      # Endereços internos do Keycloak na rede Docker.
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/recomeco
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/recomeco/protocol/openid-connect/certs

    ports:
      - "8084:8084"

    depends_on:
      logistica-postgres:
        condition: service_healthy

    # Participa da rede privada da logística e da rede compartilhada.
    networks:
      - logistica-network
      - recomeco-network-logistica


  # PostgreSQL exclusivo do logistica-service.
  logistica-postgres:
    image: postgres:17
    container_name: logistica-postgres

    environment:
      POSTGRES_DB: logisticadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - logistica-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logisticadb"]
      interval: 5s
      timeout: 3s
      retries: 10

    # O banco participa somente da rede privada.
    networks:
      - logistica-network


volumes:

  # Nome físico fixo, independente do projeto Compose utilizado.
  logistica-postgres-data:
    name: recomeco-stack-local_logistica-postgres-data


networks:

  # Rede privada entre logistica-service e logistica-postgres.
  logistica-network:

  # Nome lógico exclusivo neste arquivo.
  # Aponta para a rede real compartilhada recomeco-network.
  recomeco-network-logistica:
    name: recomeco-network
    external: true